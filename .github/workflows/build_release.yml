name: Build & Release (JitPack compatible)

permissions:
  contents: write

on:
  push:
    branches:
      - release
      - nightly

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch all Git tags
        run: git fetch --tags

      - name: Check for new commits since last tag
        if: github.ref == 'refs/heads/release'
        id: check_commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

          if [ -z "$LAST_TAG" ]; then
            echo "no_new_commits=false" >> $GITHUB_OUTPUT
          else
            NEW_COMMITS=$(git log ${LAST_TAG}..HEAD --oneline)
            if [ -z "$NEW_COMMITS" ]; then
              echo "no_new_commits=true" >> $GITHUB_OUTPUT
            else
              echo "no_new_commits=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create Git tag
        if: github.ref == 'refs/heads/release' && steps.check_commits.outputs.no_new_commits != 'true'
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: release
          tag_prefix: "v"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Gradle project
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: jars
          path: build/libs/*.jar

      - name: Generate changelog
        if: github.ref == 'refs/heads/release' && steps.check_commits.outputs.no_new_commits != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=${{ steps.check_commits.outputs.last_tag }}
          CURR_TAG=${{ steps.version.outputs.new_tag }}

          git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURR_TAG}" >> RELEASE_NOTES.md

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/release' && steps.check_commits.outputs.no_new_commits != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: "LettuceWrapper ${{ steps.version.outputs.new_tag }}"
          body_path: RELEASE_NOTES.md
          files: build/libs/*.jar
